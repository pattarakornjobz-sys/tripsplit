<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ทริป — Trip Split</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#EFEDE8">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TripSplit">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="theme.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
<script>initTheme();</script>
</head>
<body>
<div class="phone">
  <div class="headbar">
    <div class="back" id="btnBack">←</div>
    <div class="title" id="tripTitle">กำลังโหลด...</div>
    <span id="statusPill"></span>
    <div class="back" id="btnMenu" style="margin-left:8px;">···</div>
  </div>
  <div id="tripSub" style="padding:2px 16px 0;font-size:12px;color:var(--faint);"></div>

  <div class="subtabs">
    <div class="subtab" data-tab="members">สมาชิก</div>
    <div class="subtab" data-tab="expenses">ค่าใช้จ่าย</div>
    <div class="subtab" data-tab="summary">สรุป</div>
  </div>

  <div id="fab" style="padding:10px 16px 2px;display:none;">
    <button class="btn btn-primary" id="btnAddExpense" style="height:48px;border-radius:24px;">+ เพิ่มค่าใช้จ่าย</button>
    <div id="btnAddMulti" style="text-align:center;margin-top:8px;font-size:12.5px;color:var(--muted);cursor:pointer;">+ เพิ่มหลายรายการพร้อมกัน</div>
  </div>

  <div class="scroll" id="scroll"><div class="empty">กำลังโหลด...</div></div>
</div>

<div id="modalRoot"></div>

<script>
let ME = null, TRIP = null, MEMBERS = [], INVITES = [], EXPENSES = [], SHARES = [], SETTLEMENTS = [];
let TAB = qs('tab') || 'expenses';
const tripId = qs('id');

function P(userId) {
  const m = MEMBERS.find(m => m.user_id === userId);
  return m ? m.profile : { display_name: 'ผู้ใช้', avatar_url: null };
}

async function load() {
  ME = await requireAuth();
  if (!ME || !tripId) { location.href = 'trips.html'; return; }
  document.getElementById('btnBack').addEventListener('click', () => location.href = 'trips.html');
  document.querySelectorAll('.subtab').forEach(el => el.addEventListener('click', () => { TAB = el.dataset.tab; render(); }));
  document.getElementById('btnAddExpense').addEventListener('click', () => openExpenseModal());
  document.getElementById('btnAddMulti').addEventListener('click', openMultiExpenseModal);
  document.getElementById('btnMenu').addEventListener('click', openTripMenu);

  await fetchAll();
  render();

  sb.channel('trip-' + tripId)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'ts_expenses', filter: 'trip_id=eq.' + tripId }, async () => { await fetchAll(); render(); })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'ts_settlements', filter: 'trip_id=eq.' + tripId }, async () => { await fetchAll(); render(); })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'trip_members', filter: 'trip_id=eq.' + tripId }, async () => { await fetchAll(); render(); })
    .subscribe();
}

async function fetchAll() {
  const { data: trip, error: tripErr } = await sb.from('trips').select('*').eq('id', tripId).single();
  if (tripErr) { toast('โหลดทริปไม่สำเร็จ: ' + tripErr.message); }
  TRIP = trip;

  const { data: members, error: memErr } = await sb.from('trip_members')
    .select('user_id, role, profile:profiles!trip_members_user_id_profiles_fkey(id,display_name,avatar_url,email,nickname,phone,bank_code,bank_account,account_holder,qr_url,pay_method)')
    .eq('trip_id', tripId);
  if (memErr) { toast('โหลดสมาชิกไม่สำเร็จ: ' + memErr.message); }
  MEMBERS = members || [];

  const { data: invites, error: invErr } = await sb.from('trip_invites').select('*').eq('trip_id', tripId).eq('status', 'pending');
  if (invErr) { toast('โหลดคำเชิญไม่สำเร็จ: ' + invErr.message); }
  INVITES = invites || [];

  const { data: expenses, error: expErr } = await sb.from('ts_expenses')
    .select('*, payer:profiles!ts_expenses_payer_id_fkey(id,display_name,avatar_url)')
    .eq('trip_id', tripId).order('created_at', { ascending: false });
  if (expErr) { toast('โหลดค่าใช้จ่ายไม่สำเร็จ: ' + expErr.message); }
  EXPENSES = expenses || [];

  const expIds = EXPENSES.map(e => e.id);
  const { data: shares, error: shareErr } = expIds.length
    ? await sb.from('ts_expense_shares').select('*').in('expense_id', expIds)
    : { data: [], error: null };
  if (shareErr) { toast('โหลดส่วนแบ่งไม่สำเร็จ: ' + shareErr.message); }
  SHARES = shares || [];

  const { data: settlements, error: setErr } = await sb.from('ts_settlements').select('*').eq('trip_id', tripId).eq('confirmed', true);
  if (setErr) { toast('โหลดยอดโอนไม่สำเร็จ: ' + setErr.message); }
  SETTLEMENTS = settlements || [];
}

function render() {
  if (!TRIP) {
    document.getElementById('scroll').innerHTML =
      '<div class="empty">โหลดทริปไม่สำเร็จ<br>ลองปิดแล้วเปิดหน้านี้ใหม่อีกครั้ง<br><br>' +
      '<span style="font-size:11px;color:var(--faint);">tripId: ' + escapeHtml(tripId || '(ไม่มี)') + '</span></div>';
    return;
  }
  document.getElementById('tripTitle').textContent = TRIP.name;
  document.getElementById('tripSub').textContent = fmtDateRange(TRIP.start_date, TRIP.end_date) + ' · ' + TRIP.currency;
  document.getElementById('statusPill').innerHTML = TRIP.status === 'open'
    ? '<span class="pill pill-open">เปิดอยู่</span>' : '<span class="pill pill-closed">ปิดแล้ว</span>';
  document.querySelectorAll('.subtab').forEach(el => el.classList.toggle('subtab-active', el.dataset.tab === TAB));
  document.getElementById('fab').style.display = (TAB === 'expenses' && TRIP.status === 'open') ? 'block' : 'none';

  const el = document.getElementById('scroll');
  if (TAB === 'members') el.innerHTML = renderMembers();
  else if (TAB === 'expenses') el.innerHTML = renderExpenses();
  else el.innerHTML = renderSummary();

  bindTabEvents();
}

function avatarHtml(profile, size) {
  size = size || 38;
  if (profile && profile.avatar_url) return `<img src="${profile.avatar_url}" style="width:${size}px;height:${size}px;border-radius:50%;object-fit:cover;flex-shrink:0;">`;
  const bg = avatarColor(profile ? profile.id : Math.random());
  const ini = initials(profile ? profile.display_name : '?');
  return `<div class="avatar" style="width:${size}px;height:${size}px;background:${bg};font-size:${size*0.4}px;">${ini}</div>`;
}

function renderMembers() {
  const rows = MEMBERS.map(m => `
    <div class="card card-static" style="display:flex;align-items:center;gap:12px;">
      ${avatarHtml(m.profile)}
      <div style="flex:1;min-width:0;">
        <div style="font-size:14.5px;font-weight:600;color:var(--ink);">${escapeHtml(m.profile ? m.profile.display_name : 'ผู้ใช้')}${m.user_id === ME.id ? ' (คุณ)' : ''}</div>
        <div style="font-size:12px;color:var(--faint);">${escapeHtml(m.profile ? m.profile.email : '')}</div>
      </div>
      ${m.role === 'owner' ? '<span class="pill pill-open">เจ้าของ</span>' : ''}
    </div>`).join('');

  const pending = INVITES.map(iv => `
    <div class="card card-static" style="display:flex;align-items:center;gap:12px;">
      <div class="avatar" style="width:38px;height:38px;background:var(--disabled);">${initials(iv.email)}</div>
      <div style="flex:1;min-width:0;">
        <div style="font-size:14.5px;color:var(--ink);">${escapeHtml(iv.email)}</div>
        <div style="font-size:12px;color:var(--faint);">ยังไม่เข้าร่วม</div>
      </div>
      <span class="pill pill-pending">รอตอบรับ</span>
    </div>`).join('');

  const link = location.origin + location.pathname.replace('trip.html', 'join.html') + '?code=' + TRIP.invite_code;

  const inviteBox = TRIP.status === 'open' ? `
    <div class="section-label">เชิญเพื่อนเพิ่ม</div>
    <div class="card card-static">
      <div style="font-size:12px;color:var(--muted);margin-bottom:8px;">แชร์ลิงก์นี้ให้เพื่อน (เพื่อนต้องล็อกอินด้วย Gmail ก่อน)</div>
      <div style="display:flex;gap:8px;">
        <input readonly value="${link}" style="flex:1;height:40px;border-radius:10px;border:1px solid var(--border);padding:0 10px;font-size:12px;color:var(--muted);">
        <button class="btn btn-outline" id="btnCopyLink" style="width:70px;height:40px;">คัดลอก</button>
      </div>
      <div style="display:flex;gap:8px;margin-top:8px;">
        <input id="inviteEmail" type="email" placeholder="อีเมล Gmail ของเพื่อน" style="flex:1;height:40px;border-radius:10px;border:1px solid var(--border);padding:0 10px;font-size:13px;">
        <button class="btn btn-outline" id="btnInviteEmail" style="width:70px;height:40px;">เพิ่ม</button>
      </div>
    </div>` : '';

  return `<div class="section-label">เข้าร่วมแล้ว (${MEMBERS.length})</div>${rows}
    ${pending ? '<div class="section-label">รอตอบรับ</div>' + pending : ''}
    ${inviteBox}`;
}

function renderExpenses() {
  if (!EXPENSES.length) return '<div class="empty">ยังไม่มีรายการค่าใช้จ่าย<br>' + (TRIP.status === 'open' ? 'กดปุ่ม “+ เพิ่มค่าใช้จ่าย” ด้านบน' : '') + '</div>';
  const catName = id => (CATS.find(c => c.id === id) || { name: 'อื่นๆ' }).name;
  return EXPENSES.map(e => `
    <div class="card" data-expense="${e.id}" style="display:flex;align-items:center;gap:12px;cursor:pointer;">
      ${avatarHtml(e.payer)}
      <div style="flex:1;min-width:0;">
        <div style="font-size:14.5px;font-weight:600;color:var(--ink);">${escapeHtml(e.title)}</div>
        <div style="font-size:12px;color:var(--faint);">${escapeHtml(e.payer ? e.payer.display_name : '')} จ่าย · ${catName(e.category)}</div>
      </div>
      <div style="text-align:right;flex-shrink:0;">
        <div style="font-size:15px;font-weight:600;color:var(--ink);">${money(e.amount, TRIP.currency)}</div>
        <div style="margin-top:2px;font-size:10.5px;color:var(--faint);">${canEdit(e) ? 'แตะเพื่อแก้ไข / ลบ' : 'แตะเพื่อดูรายละเอียด'}</div>
      </div>
    </div>`).join('');
}

function renderSummary() {
  const balances = {};
  MEMBERS.forEach(m => balances[m.user_id] = 0);
  EXPENSES.forEach(e => { balances[e.payer_id] = (balances[e.payer_id] || 0) + Number(e.amount); });
  SHARES.forEach(s => { balances[s.user_id] = (balances[s.user_id] || 0) - Number(s.amount); });
  SETTLEMENTS.forEach(s => { balances[s.from_user] = (balances[s.from_user] || 0) + Number(s.amount); balances[s.to_user] = (balances[s.to_user] || 0) - Number(s.amount); });

  const total = EXPENSES.reduce((a, e) => a + Number(e.amount), 0);
  const transfers = computeSettlements(balances);

  const balRows = MEMBERS.map(m => {
    const b = balances[m.user_id] || 0;
    const color = b > 0.5 ? 'var(--green)' : (b < -0.5 ? 'var(--red)' : 'var(--faint)');
    const label = b > 0.5 ? 'ได้คืน' : (b < -0.5 ? 'ต้องจ่าย' : 'เท่ากันพอดี');
    return `<div style="display:flex;align-items:center;gap:10px;padding:9px 0;">
      ${avatarHtml(m.profile, 30)}
      <div style="flex:1;font-size:13.5px;color:var(--ink);">${escapeHtml(m.profile ? m.profile.display_name : '')}${m.user_id === ME.id ? ' (คุณ)' : ''}</div>
      <div style="text-align:right;">
        <div style="font-size:14px;font-weight:600;color:${color};">${money(Math.abs(b), TRIP.currency)}</div>
        <div style="font-size:10.5px;color:var(--faint);">${label}</div>
      </div>
    </div>`;
  }).join('');

  const transferRows = transfers.length ? transfers.map((tr, i) => `
    <div class="card card-static">
      <div style="display:flex;align-items:center;gap:10px;">
        ${avatarHtml(P(tr.from), 30)}
        <div style="font-size:13px;color:var(--ink);flex:1;">${escapeHtml(P(tr.from).display_name)} → ${escapeHtml(P(tr.to).display_name)}</div>
        <div style="font-size:14.5px;font-weight:600;color:var(--ink);">${money(tr.amount, TRIP.currency)}</div>
      </div>
      <div data-payee="${i}" style="margin-top:10px;display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:13px;background:var(--fill);cursor:pointer;">
        <div class="row-icon" style="width:32px;height:32px;border-radius:11px;font-size:13px;">${payMethodOf(P(tr.to)) ? PAY_METHODS[payMethodOf(P(tr.to))].icon : '?'}</div>
        <div style="flex:1;min-width:0;">
          <div style="font-size:12.5px;font-weight:600;color:var(--ink);">${escapeHtml(P(tr.to).nickname || P(tr.to).display_name)} ${payMethodSummary(P(tr.to))}</div>
          <div style="margin-top:2px;font-size:11px;color:var(--faint);">แตะเพื่อดูเลข / QR แล้วคัดลอกไปโอน</div>
        </div>
        <div style="color:var(--faint);font-size:15px;">›</div>
      </div>
      ${tr.from === ME.id ? `<button class="btn btn-primary" data-confirm="${i}" style="height:38px;margin-top:10px;font-size:13px;">ยืนยันว่าโอนแล้ว</button>` : `<div style="margin-top:8px;font-size:11.5px;color:var(--faint);">รอ ${escapeHtml(P(tr.from).nickname || P(tr.from).display_name)} โอน</div>`}
    </div>`).join('') : '<div class="empty">ยอดลงตัวแล้ว ไม่มีใครติดใคร 🎉</div>';

  window.__transfers = transfers;

  const closeBtn = TRIP.owner_id === ME.id
    ? (TRIP.status === 'open'
      ? '<button class="btn btn-danger" id="btnClose" style="margin-top:18px;border-radius:24px;">ปิดทริปนี้</button>'
      : '<button class="btn btn-outline" id="btnReopen" style="margin-top:18px;border-radius:24px;">เปิดทริปอีกครั้ง</button>')
    : '';

  return `
    <div class="card card-static" style="background:var(--hero);color:var(--hero-ink);">
      <div style="font-size:11.5px;color:var(--faint);">ยอดรวมค่าใช้จ่ายทั้งทริป</div>
      <div style="margin-top:6px;font-size:30px;font-weight:600;letter-spacing:-.02em;">${money(total, TRIP.currency)}</div>
    </div>
    <div class="section-label">ยอดสุทธิแต่ละคน</div>
    <div class="card card-static">${balRows}</div>
    <div class="section-label">ใครโอนให้ใคร</div>
    ${transferRows}
    ${closeBtn}
  `;
}

function bindTabEvents() {
  const copy = document.getElementById('btnCopyLink');
  if (copy) copy.addEventListener('click', () => {
    const link = location.origin + location.pathname.replace('trip.html', 'join.html') + '?code=' + TRIP.invite_code;
    navigator.clipboard.writeText(link).then(() => toast('คัดลอกลิงก์แล้ว'));
  });
  const inviteBtn = document.getElementById('btnInviteEmail');
  if (inviteBtn) inviteBtn.addEventListener('click', async () => {
    const inp = document.getElementById('inviteEmail');
    const v = inp.value.trim().toLowerCase();
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)) { toast('ใส่อีเมลให้ถูกรูปแบบก่อนนะ'); return; }
    const { error } = await sb.from('trip_invites').insert({ trip_id: tripId, email: v });
    if (error) { toast('เพิ่มไม่สำเร็จ: ' + error.message); return; }
    inp.value = '';
    toast('เพิ่มคำเชิญแล้ว');
    await fetchAll(); render();
  });
  document.querySelectorAll('[data-payee]').forEach(el => el.addEventListener('click', () => {
    const tr = window.__transfers[+el.dataset.payee];
    openPayeeSheet(P(tr.to), tr.amount, TRIP.currency);
  }));
  document.querySelectorAll('[data-confirm]').forEach(btn => btn.addEventListener('click', async () => {
    const tr = window.__transfers[+btn.dataset.confirm];
    btn.disabled = true; btn.textContent = 'กำลังบันทึก...';
    const { error } = await sb.from('ts_settlements').insert({ trip_id: tripId, from_user: tr.from, to_user: tr.to, amount: tr.amount, confirmed: true });
    if (error) { toast('บันทึกไม่สำเร็จ: ' + error.message); btn.disabled = false; return; }
    toast('บันทึกการโอนแล้ว');
    await fetchAll(); render();
  }));
  document.querySelectorAll('[data-expense]').forEach(el => el.addEventListener('click', () => {
    const e = EXPENSES.find(x => x.id === el.dataset.expense);
    if (e) openExpenseSheet(e);
  }));
  const closeBtn = document.getElementById('btnClose');
  if (closeBtn) closeBtn.addEventListener('click', closeTrip);
  const reopenBtn = document.getElementById('btnReopen');
  if (reopenBtn) reopenBtn.addEventListener('click', reopenTrip);
}

/* ---------- Trip status ---------- */
async function setTripStatus(status) {
  const { error } = await sb.from('trips').update({ status }).eq('id', tripId);
  if (error) { toast((status === 'closed' ? 'ปิด' : 'เปิด') + 'ทริปไม่สำเร็จ: ' + error.message); return; }
  toast(status === 'closed' ? 'ปิดทริปแล้ว · เพิ่มค่าใช้จ่ายไม่ได้อีก' : 'เปิดทริปอีกครั้งแล้ว');
  await fetchAll(); render();
}

function closeTrip() {
  if (!confirm('ปิดทริปนี้? หลังปิดแล้วจะเพิ่มหรือแก้ค่าใช้จ่ายไม่ได้')) return;
  setTripStatus('closed');
}

function reopenTrip() { setTripStatus('open'); }

/* ---------- Trip menu (···) ---------- */
function openTripMenu() {
  const isOwner = TRIP.owner_id === ME.id;
  const root = document.getElementById('modalRoot');
  const statusRow = !isOwner ? '' : (TRIP.status === 'open'
    ? '<button class="btn btn-danger" id="tmClose" style="margin-top:8px;border-radius:24px;">ปิดทริปนี้</button>'
    : '<button class="btn btn-primary" id="tmReopen" style="margin-top:8px;border-radius:24px;">เปิดทริปอีกครั้ง</button>');

  root.innerHTML = `
    <div class="modal-bg" id="tmBg">
      <div class="modal-sheet" onclick="event.stopPropagation()">
        <h3>จัดการทริป</h3>
        <div style="font-size:12.5px;line-height:1.6;color:var(--muted);">${escapeHtml(TRIP.name)} · ${TRIP.status === 'open' ? 'เปิดอยู่' : 'ปิดแล้ว'}</div>
        <button class="btn btn-outline" id="tmMembers" style="margin-top:14px;border-radius:24px;">ผู้ร่วมทริปและคำเชิญ</button>
        ${statusRow}
        ${isOwner ? '<div style="margin-top:10px;font-size:11.5px;line-height:1.55;color:var(--faint);">' + (TRIP.status === 'open' ? 'ปิดทริปแล้วจะไม่มีใครเพิ่มหรือแก้ค่าใช้จ่ายได้ ยอดสรุปจะถูกล็อกไว้' : 'เปิดใหม่แล้วสมาชิกบันทึกค่าใช้จ่ายต่อได้') + '</div>' : '<div style="margin-top:10px;font-size:11.5px;color:var(--faint);">เฉพาะเจ้าของทริปเท่านั้นที่ปิดหรือเปิดทริปได้</div>'}
        <button class="btn btn-outline" id="tmCancel" style="margin-top:14px;border-radius:24px;">ปิดหน้าต่าง</button>
      </div>
    </div>`;

  const close = () => { root.innerHTML = ''; };
  document.getElementById('tmBg').addEventListener('click', close);
  document.getElementById('tmCancel').addEventListener('click', close);
  document.getElementById('tmMembers').addEventListener('click', () => { close(); TAB = 'members'; render(); });
  const c = document.getElementById('tmClose');
  if (c) c.addEventListener('click', () => { close(); closeTrip(); });
  const r = document.getElementById('tmReopen');
  if (r) r.addEventListener('click', () => { close(); reopenTrip(); });
}

/* ---------- Expense detail / edit / delete ---------- */
// The creator of a row and the trip owner may change it, while the trip is open.
function canEdit(e) {
  return TRIP.status === 'open' && (e.created_by === ME.id || e.payer_id === ME.id || TRIP.owner_id === ME.id);
}

function openExpenseSheet(e) {
  const root = document.getElementById('modalRoot');
  const catName = (CATS.find(c => c.id === e.category) || { name: 'อื่นๆ' }).name;
  const rows = SHARES.filter(s => s.expense_id === e.id).map(s => `
    <div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--border);">
      ${avatarHtml(P(s.user_id), 28)}
      <div style="flex:1;font-size:13px;color:var(--ink);">${escapeHtml(P(s.user_id).nickname || P(s.user_id).display_name)}${s.user_id === ME.id ? ' (คุณ)' : ''}</div>
      <div style="font-size:13px;font-weight:600;color:var(--ink);">${money(s.amount, TRIP.currency)}</div>
    </div>`).join('');

  const actions = canEdit(e)
    ? '<button class="btn btn-primary" id="exEdit" style="margin-top:16px;border-radius:24px;">แก้ไขรายการ</button>'
      + '<button class="btn btn-danger" id="exDelete" style="margin-top:8px;border-radius:24px;">ลบรายการนี้</button>'
    : '<div style="margin-top:16px;font-size:11.5px;line-height:1.55;color:var(--faint);">' + (TRIP.status === 'open' ? 'แก้ได้เฉพาะคนที่บันทึกรายการนี้ คนจ่าย หรือเจ้าของทริป' : 'ทริปปิดแล้ว แก้ไขรายการไม่ได้') + '</div>';

  root.innerHTML = `
    <div class="modal-bg" id="exBg">
      <div class="modal-sheet" onclick="event.stopPropagation()">
        <h3>${escapeHtml(e.title)}</h3>
        <div style="display:flex;align-items:flex-end;justify-content:space-between;gap:12px;">
          <div style="font-size:12.5px;color:var(--muted);">${escapeHtml(e.payer ? e.payer.display_name : '')} จ่าย · ${catName}</div>
          <div style="font-size:24px;font-weight:600;color:var(--ink);white-space:nowrap;">${money(e.amount, TRIP.currency)}</div>
        </div>
        <div class="section-label" style="margin-top:14px;">ส่วนแบ่งของแต่ละคน</div>
        ${rows || '<div class="empty">ไม่มีข้อมูลส่วนแบ่ง</div>'}
        ${actions}
        <button class="btn btn-outline" id="exCancel" style="margin-top:8px;border-radius:24px;">ปิด</button>
      </div>
    </div>`;

  const close = () => { root.innerHTML = ''; };
  document.getElementById('exBg').addEventListener('click', close);
  document.getElementById('exCancel').addEventListener('click', close);
  const ed = document.getElementById('exEdit');
  if (ed) ed.addEventListener('click', () => { close(); openExpenseModal(e); });
  const del = document.getElementById('exDelete');
  if (del) del.addEventListener('click', async () => {
    if (!confirm('ลบ “' + e.title + '” ออกจากทริป? ยอดสรุปจะคำนวณใหม่ทันที')) return;
    del.disabled = true; del.textContent = 'กำลังลบ...';
    await sb.from('ts_expense_shares').delete().eq('expense_id', e.id);
    const { error } = await sb.from('ts_expenses').delete().eq('id', e.id);
    if (error) { toast('ลบไม่สำเร็จ: ' + error.message); del.disabled = false; del.textContent = 'ลบรายการนี้'; return; }
    toast('ลบรายการแล้ว');
    close();
    await fetchAll(); render();
  });
}

/* ---------- Add expense modal ---------- */
// A brand-new trip may not have its members row yet, so always offer yourself:
// leaving the payer unset would mean "nobody paid" instead of "me".
function payerOptions() {
  const list = MEMBERS.slice();
  if (!list.some(m => m.user_id === ME.id)) {
    list.unshift({ user_id: ME.id, profile: { id: ME.id, display_name: 'คุณ' } });
  }
  return list;
}

/* ---------- Add several expenses at once (equal-split only) ---------- */
function openMultiExpenseModal() {
  const root = document.getElementById('modalRoot');
  let debounceTimer = null;
  const state = {
    payer: ME.id,
    involved: payerOptions().map(m => m.user_id),
    rows: [{ title: '', amount: '', category: 'other' }, { title: '', amount: '', category: 'other' }, { title: '', amount: '', category: 'other' }],
  };

  function renderModal() {
    const active = document.activeElement;
    let activeSelector = null, selStart = null, selEnd = null;
    if (active && root.contains(active) && active.dataset && active.dataset.row !== undefined) {
      activeSelector = '[data-row="' + active.dataset.row + '"][data-field="' + active.dataset.field + '"]';
      if (typeof active.selectionStart === 'number') { selStart = active.selectionStart; selEnd = active.selectionEnd; }
    }

    const validRows = state.rows.filter(r => r.title.trim() && Number(r.amount) > 0);
    const total = validRows.reduce((a, r) => a + Number(r.amount), 0);

    root.innerHTML = `
    <div class="modal-bg" id="mmBg">
      <div class="modal-sheet" onclick="event.stopPropagation()">
        <h3>เพิ่มหลายรายการพร้อมกัน</h3>
        <div style="font-size:12px;line-height:1.6;color:var(--faint);margin-bottom:10px;">สำหรับรายการที่หารเท่ากันทั้งหมด เช่น ค่าที่พัก ค่ามัดจำ ค่าเช่า — ถ้ารายการไหนต้องระบุสัดส่วนเอง ให้เพิ่มทีละรายการแทน</div>
        <div id="mmRows">
          ${state.rows.map((r, i) => `
            <div style="display:flex;gap:6px;margin-bottom:8px;align-items:center;">
              <input data-row="${i}" data-field="title" type="text" placeholder="ชื่อรายการ" value="${escapeAttr(r.title)}" style="flex:2;height:44px;border-radius:10px;border:1px solid var(--border-strong);background:var(--input);color:var(--ink);padding:0 10px;font-size:13.5px;min-width:0;">
              <input data-row="${i}" data-field="amount" type="number" inputmode="decimal" placeholder="0" value="${escapeAttr(r.amount)}" style="flex:1;height:44px;border-radius:10px;border:1px solid var(--border-strong);background:var(--input);color:var(--ink);padding:0 10px;font-size:13.5px;min-width:0;text-align:right;">
              <select data-row="${i}" data-field="category" style="height:44px;border-radius:10px;border:1px solid var(--border-strong);background:var(--input);color:var(--ink);font-size:12.5px;flex-shrink:0;">
                ${CATS.map(c => `<option value="${c.id}" ${c.id === r.category ? 'selected' : ''}>${c.name}</option>`).join('')}
              </select>
              ${state.rows.length > 1 ? `<div data-remove="${i}" style="width:30px;height:44px;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:var(--red);cursor:pointer;font-size:18px;">×</div>` : '<div style="width:30px;flex-shrink:0;"></div>'}
            </div>`).join('')}
        </div>
        <div id="mmAddRow" style="text-align:center;padding:8px 0;font-size:13px;color:var(--green-text);cursor:pointer;">+ เพิ่มอีกรายการ</div>

        <div class="divider"></div>
        <div class="field">
          <label>ใครจ่าย (ใช้กับทุกรายการด้านบน)</label>
          <select id="mmPayer">${payerOptions().map(m => `<option value="${m.user_id}" ${m.user_id === state.payer ? 'selected' : ''}>${escapeHtml(m.user_id === ME.id ? 'คุณ' : (m.profile ? m.profile.display_name : ''))}</option>`).join('')}</select>
        </div>
        <div class="field">
          <label>หารเท่ากันระหว่าง</label>
          <div id="mmMembers">
            ${payerOptions().map(m => {
              const on = state.involved.includes(m.user_id);
              return `<div class="mrow" data-mid="${m.user_id}" style="display:flex;align-items:center;gap:10px;padding:6px 0;cursor:pointer;">
                <div style="width:20px;height:20px;border-radius:6px;border:1.5px solid ${on ? 'var(--green)' : 'var(--border)'};background:${on ? 'var(--green)' : 'transparent'};color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;">${on ? '✓' : ''}</div>
                <div style="flex:1;font-size:13.5px;color:${on ? 'var(--ink)' : 'var(--faint)'};">${escapeHtml(m.user_id === ME.id ? 'คุณ' : (m.profile ? m.profile.display_name : ''))}</div>
              </div>`;
            }).join('')}
          </div>
        </div>

        <div style="display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin:6px 0 4px;">
          <span>${validRows.length} รายการที่กรอกครบ</span>
          <span style="font-weight:600;color:var(--ink);">${money(total, TRIP.currency)}</span>
        </div>
        <button class="btn btn-primary" id="mmSave" style="margin-top:10px;border-radius:24px;" ${validRows.length ? '' : 'disabled'}>บันทึกทั้งหมด (${validRows.length} รายการ)</button>
        <button class="btn btn-outline" id="mmCancel" style="margin-top:8px;border-radius:24px;">ยกเลิก</button>
      </div>
    </div>`;

    document.getElementById('mmBg').addEventListener('click', close);
    document.getElementById('mmCancel').addEventListener('click', close);
    root.querySelectorAll('[data-row]').forEach(inp => {
      const isSelect = inp.tagName === 'SELECT';
      inp.addEventListener(isSelect ? 'change' : 'input', e => {
        state.rows[+e.target.dataset.row][e.target.dataset.field] = e.target.value;
        if (isSelect) { renderModal(); return; }
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(renderModal, 400);
      });
    });
    root.querySelectorAll('[data-remove]').forEach(el => el.addEventListener('click', () => {
      state.rows.splice(+el.dataset.remove, 1);
      renderModal();
    }));
    document.getElementById('mmAddRow').addEventListener('click', () => {
      state.rows.push({ title: '', amount: '', category: 'other' });
      renderModal();
    });
    document.getElementById('mmPayer').addEventListener('change', e => { state.payer = e.target.value; });
    root.querySelectorAll('#mmMembers .mrow').forEach(row => row.addEventListener('click', () => {
      const id = row.dataset.mid;
      state.involved = state.involved.includes(id) ? state.involved.filter(x => x !== id) : state.involved.concat([id]);
      renderModal();
    }));
    document.getElementById('mmSave').addEventListener('click', saveAll);

    if (activeSelector) {
      const toFocus = root.querySelector(activeSelector);
      if (toFocus) {
        toFocus.focus();
        if (selStart !== null && toFocus.setSelectionRange) {
          try { toFocus.setSelectionRange(selStart, selEnd); } catch (e) {}
        }
      }
    }
  }

  function close() { root.innerHTML = ''; }

  async function saveAll() {
    const validRows = state.rows.filter(r => r.title.trim() && Number(r.amount) > 0);
    if (!validRows.length) { toast('กรอกอย่างน้อย 1 รายการให้ครบ'); return; }
    if (!state.involved.length) { toast('เลือกคนที่ร่วมหารอย่างน้อย 1 คน'); return; }

    const saveBtn = document.getElementById('mmSave');
    saveBtn.disabled = true;
    let done = 0, failed = 0;

    for (const r of validRows) {
      saveBtn.textContent = `กำลังบันทึก (${done + 1}/${validRows.length})...`;
      const amount = Number(r.amount);
      const per = Math.round((amount / state.involved.length) * 100) / 100;
      let assigned = 0;
      const shareRows = state.involved.map((id, i) => {
        const isLast = i === state.involved.length - 1;
        const amt = isLast ? Math.round((amount - assigned) * 100) / 100 : per;
        assigned += amt;
        return { user_id: id, amount: amt };
      });

      const { data: expense, error } = await sb.from('ts_expenses')
        .insert({ trip_id: tripId, payer_id: state.payer, title: r.title.trim(), amount, category: r.category, split_type: 'equal', created_by: ME.id })
        .select().single();
      if (error) { failed++; continue; }

      const { error: shareErr } = await sb.from('ts_expense_shares')
        .insert(shareRows.map(s => ({ expense_id: expense.id, user_id: s.user_id, amount: s.amount })));
      if (shareErr) { failed++; continue; }
      done++;
    }

    if (failed) toast(`บันทึกสำเร็จ ${done} รายการ, ล้มเหลว ${failed} รายการ`);
    else toast(`เพิ่ม ${done} รายการแล้ว`);
    close();
    await fetchAll(); render();
  }

  renderModal();
}

/* ---------- Add / edit a single expense ---------- */
// Pass an expense row to edit it; call with no argument to add a new one.
function openExpenseModal(existing) {
  const editing = !!existing;
  const own = editing ? SHARES.filter(s => s.expense_id === existing.id) : [];
  const state = editing
    ? {
        title: existing.title, amount: String(existing.amount), category: existing.category || 'other',
        payer: existing.payer_id, splitType: existing.split_type || 'equal',
        involved: own.map(s => s.user_id),
        exact: own.reduce((acc, s) => { acc[s.user_id] = String(s.amount); return acc; }, {}),
      }
    : { title: '', amount: '', category: 'other', payer: ME.id, splitType: 'equal', involved: payerOptions().map(m => m.user_id), exact: {} };
  const root = document.getElementById('modalRoot');
  let debounceTimer = null;

  // While editing, someone who has a share but has since left the trip must
  // still show up so their amount is not silently dropped.
  function splitCandidates() {
    const list = payerOptions();
    Object.keys(state.exact).concat(state.involved).forEach(id => {
      if (!list.some(m => m.user_id === id)) list.push({ user_id: id, profile: P(id) });
    });
    return list;
  }

  function renderModal() {
    const involvedCount = state.involved.length || 1;
    const perHead = Number(state.amount || 0) / involvedCount;
    const exactSum = splitCandidates().reduce((a, m) => a + Number(state.exact[m.user_id] || 0), 0);
    const remain = Number(state.amount || 0) - exactSum;

    // Remember what was focused (and cursor position) before we blow away
    // the DOM, so continuous typing doesn't get interrupted every keystroke.
    const active = document.activeElement;
    let activeSelector = null, selStart = null, selEnd = null;
    if (active && root.contains(active)) {
      if (active.id) activeSelector = '#' + active.id;
      else if (active.dataset && active.dataset.exact) activeSelector = '[data-exact="' + active.dataset.exact + '"]';
      if (typeof active.selectionStart === 'number') { selStart = active.selectionStart; selEnd = active.selectionEnd; }
    }

    root.innerHTML = `
    <div class="modal-bg" id="modalBg">
      <div class="modal-sheet" onclick="event.stopPropagation()">
        <h3>${editing ? 'แก้ไขค่าใช้จ่าย' : 'เพิ่มค่าใช้จ่าย'}</h3>
        <div class="field"><label>ชื่อรายการ</label><input id="mTitle" type="text" placeholder="เช่น ค่าอาหารเย็น" value="${escapeAttr(state.title)}"></div>
        <div class="field"><label>จำนวนเงิน (${TRIP.currency})</label><input id="mAmount" type="number" inputmode="decimal" placeholder="0" value="${escapeAttr(state.amount)}"></div>
        <div class="field">
          <label>หมวดหมู่</label>
          <select id="mCat">${CATS.map(c => `<option value="${c.id}" ${c.id === state.category ? 'selected' : ''}>${c.name}</option>`).join('')}</select>
        </div>
        <div class="field">
          <label>ใครจ่าย</label>
          <select id="mPayer">${payerOptions().map(m => `<option value="${m.user_id}" ${m.user_id === state.payer ? 'selected' : ''}>${escapeHtml(m.user_id === ME.id ? 'คุณ' : (m.profile ? m.profile.display_name : ''))}</option>`).join('')}</select>
        </div>
        <div class="field">
          <label>วิธีหาร</label>
          <div style="display:flex;gap:6px;">
            <div class="subtab ${state.splitType === 'equal' ? 'subtab-active' : ''}" id="mEqual">หารเท่ากัน</div>
            <div class="subtab ${state.splitType === 'exact' ? 'subtab-active' : ''}" id="mExact">ระบุเอง</div>
          </div>
        </div>
        <div id="splitRows">
          ${splitCandidates().map(m => {
            const on = state.involved.includes(m.user_id);
            if (state.splitType === 'equal') {
              return `<div class="mrow" data-id="${m.user_id}" style="display:flex;align-items:center;gap:10px;padding:8px 0;cursor:pointer;">
                <div style="width:20px;height:20px;border-radius:6px;border:1.5px solid ${on ? 'var(--green)' : 'var(--border)'};background:${on ? 'var(--green)' : 'transparent'};color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;">${on ? '✓' : ''}</div>
                <div style="flex:1;font-size:13.5px;color:${on ? 'var(--ink)' : 'var(--faint)'};">${escapeHtml(m.user_id === ME.id ? 'คุณ' : (m.profile ? m.profile.display_name : ''))}</div>
                <div style="font-size:13px;color:${on ? 'var(--ink)' : 'var(--disabled)'};">${on ? money(perHead, TRIP.currency) : '—'}</div>
              </div>`;
            } else {
              return `<div style="display:flex;align-items:center;gap:10px;padding:6px 0;">
                <div style="flex:1;font-size:13.5px;color:var(--ink);">${escapeHtml(m.user_id === ME.id ? 'คุณ' : (m.profile ? m.profile.display_name : ''))}</div>
                <input data-exact="${m.user_id}" type="number" inputmode="decimal" placeholder="0" value="${state.exact[m.user_id] || ''}" style="width:100px;height:36px;border-radius:8px;border:1px solid var(--border);padding:0 8px;font-size:13px;text-align:right;">
              </div>`;
            }
          }).join('')}
        </div>
        ${state.splitType === 'exact' ? `<div style="margin-top:6px;font-size:12px;color:${Math.abs(remain) < 0.01 ? 'var(--green)' : 'var(--red)'};">${Math.abs(remain) < 0.01 ? 'ครบพอดี' : (remain > 0 ? 'เหลืออีก ' + money(remain, TRIP.currency) : 'เกินมา ' + money(-remain, TRIP.currency))}</div>` : ''}
        <button class="btn btn-primary" id="mSave" style="margin-top:18px;border-radius:24px;">${editing ? 'บันทึกการแก้ไข' : 'บันทึกรายการ'}</button>
        <button class="btn btn-outline" id="mCancel" style="margin-top:8px;border-radius:24px;">ยกเลิก</button>
      </div>
    </div>`;

    document.getElementById('modalBg').addEventListener('click', close);
    document.getElementById('mCancel').addEventListener('click', close);
    document.getElementById('mTitle').addEventListener('input', e => state.title = e.target.value);
    document.getElementById('mAmount').addEventListener('input', e => {
      state.amount = e.target.value;
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(renderModal, 400);
    });
    document.getElementById('mCat').addEventListener('change', e => state.category = e.target.value);
    document.getElementById('mPayer').addEventListener('change', e => state.payer = e.target.value);
    document.getElementById('mEqual').addEventListener('click', () => { state.splitType = 'equal'; renderModal(); });
    document.getElementById('mExact').addEventListener('click', () => { state.splitType = 'exact'; renderModal(); });
    root.querySelectorAll('.mrow').forEach(row => row.addEventListener('click', () => {
      const id = row.dataset.id;
      state.involved = state.involved.includes(id) ? state.involved.filter(x => x !== id) : state.involved.concat([id]);
      renderModal();
    }));
    root.querySelectorAll('[data-exact]').forEach(inp => inp.addEventListener('input', e => {
      state.exact[e.target.dataset.exact] = e.target.value;
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(renderModal, 400);
    }));
    document.getElementById('mSave').addEventListener('click', saveExpense);

    if (activeSelector) {
      const toFocus = root.querySelector(activeSelector);
      if (toFocus) {
        toFocus.focus();
        if (selStart !== null && toFocus.setSelectionRange) {
          try { toFocus.setSelectionRange(selStart, selEnd); } catch (e) {}
        }
      }
    }
  }

  function close() { root.innerHTML = ''; }

  async function saveExpense() {
    const amount = Number(state.amount);
    if (!state.title.trim()) { toast('ใส่ชื่อรายการก่อนนะ'); return; }
    if (!amount || amount <= 0) { toast('ใส่จำนวนเงินให้ถูกต้อง'); return; }

    let shareRows = [];
    if (state.splitType === 'equal') {
      if (!state.involved.length) { toast('เลือกคนที่ร่วมจ่ายอย่างน้อย 1 คน'); return; }
      const per = Math.round((amount / state.involved.length) * 100) / 100;
      let assigned = 0;
      shareRows = state.involved.map((id, i) => {
        const isLast = i === state.involved.length - 1;
        const amt = isLast ? Math.round((amount - assigned) * 100) / 100 : per;
        assigned += amt;
        return { user_id: id, amount: amt };
      });
    } else {
      const exactSum = splitCandidates().reduce((a, m) => a + Number(state.exact[m.user_id] || 0), 0);
      if (Math.abs(exactSum - amount) > 0.5) { toast('ยอดที่แบ่งไม่เท่ากับยอดรวม'); return; }
      shareRows = splitCandidates().filter(m => Number(state.exact[m.user_id] || 0) > 0)
        .map(m => ({ user_id: m.user_id, amount: Number(state.exact[m.user_id]) }));
    }

    const saveBtn = document.getElementById('mSave');
    const label = editing ? 'บันทึกการแก้ไข' : 'บันทึกรายการ';
    saveBtn.disabled = true; saveBtn.textContent = 'กำลังบันทึก...';

    const fields = {
      payer_id: state.payer, title: state.title.trim(), amount,
      category: state.category, split_type: state.splitType,
    };

    let expenseId;
    if (editing) {
      const { error } = await sb.from('ts_expenses').update(fields).eq('id', existing.id);
      if (error) { toast('บันทึกไม่สำเร็จ: ' + error.message); saveBtn.disabled = false; saveBtn.textContent = label; return; }
      expenseId = existing.id;
      // Shares are rewritten wholesale: the split may have changed shape entirely.
      await sb.from('ts_expense_shares').delete().eq('expense_id', expenseId);
    } else {
      const { data: expense, error } = await sb.from('ts_expenses')
        .insert(Object.assign({ trip_id: tripId, created_by: ME.id }, fields)).select().single();
      if (error) { toast('บันทึกไม่สำเร็จ: ' + error.message); saveBtn.disabled = false; saveBtn.textContent = label; return; }
      expenseId = expense.id;
    }

    const { error: shareErr } = await sb.from('ts_expense_shares')
      .insert(shareRows.map(s => ({ expense_id: expenseId, user_id: s.user_id, amount: s.amount })));
    if (shareErr) { toast('บันทึกส่วนแบ่งไม่สำเร็จ: ' + shareErr.message); }

    toast(editing ? 'แก้ไขรายการแล้ว' : 'เพิ่มรายการแล้ว');
    close();
    await fetchAll(); render();
  }

  renderModal();
}

function escapeHtml(s) { return String(s || '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function escapeAttr(s) { return String(s || '').replace(/"/g, '&quot;'); }

load();
</script>
