<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trip Split — เข้าสู่ระบบ</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
</head>
<body>
<div class="phone">
  <div style="flex:1;display:flex;flex-direction:column;justify-content:space-between;padding:76px 26px 40px;background:#16201C;color:#fff;min-height:100vh;">
    <div>
      <div style="width:52px;height:52px;border-radius:16px;background:#1F6F5C;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:600;">฿</div>
      <h1 style="margin:26px 0 0;font-size:30px;line-height:1.3;font-weight:600;letter-spacing:-.02em;">หารค่าทริป<br>ให้จบในที่เดียว</h1>
      <p style="margin:14px 0 0;font-size:14px;line-height:1.7;color:rgba(255,255,255,.62);">บันทึกใครจ่ายอะไร แล้วให้แอพคำนวณว่าใครต้องโอนให้ใครเท่าไร อัปเดตสดทุกคนในทริป</p>
    </div>
    <div>
      <button id="btnGoogle" class="btn btn-google">
        <span style="width:20px;height:20px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;">
          <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 01-1.8 2.72v2.26h2.9c1.7-1.57 2.7-3.88 2.7-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.26c-.8.54-1.84.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.98v2.33A9 9 0 009 18z"/><path fill="#FBBC05" d="M3.95 10.7A5.4 5.4 0 013.68 9c0-.59.1-1.17.27-1.7V4.97H.98A9 9 0 000 9c0 1.45.35 2.83.98 4.03l2.97-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.5.46 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 00.98 4.97l2.97 2.33C4.66 5.17 6.65 3.58 9 3.58z"/></svg>
        </span>
        ดำเนินการต่อด้วย Gmail
      </button>
      <div id="pendingNote" style="display:none;margin-top:12px;padding:12px 14px;border-radius:12px;background:rgba(31,111,92,.25);font-size:12.5px;line-height:1.6;color:#fff;">มีลิงก์เชิญค้างอยู่ — ล็อกอินแล้วจะพาไปเข้าร่วมทริปให้อัตโนมัติ</div>
      <div style="margin-top:18px;text-align:center;font-size:11.5px;line-height:1.6;color:rgba(255,255,255,.4)">ยืนยันตัวตนด้วยบัญชี Google ผ่าน Supabase Auth<br>ไม่มีการเก็บรหัสผ่านในแอพ</div>
    </div>
  </div>
</div>
<script>
(async function(){
  const { data: { session } } = await sb.auth.getSession();
  const code = qs('code');
  if (code) localStorage.setItem('ts_pending_code', code);
  if (session) {
    location.href = localStorage.getItem('ts_pending_code') ? ('join.html?code=' + localStorage.getItem('ts_pending_code')) : 'trips.html';
    return;
  }
  if (localStorage.getItem('ts_pending_code')) document.getElementById('pendingNote').style.display = 'block';
  document.getElementById('btnGoogle').addEventListener('click', signInWithGoogle);
})();
</script>
</body>
</html>
