<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ประวัติทริป — Trip Split</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#EFEDE8">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TripSplit">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="theme.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
<script>initTheme();</script>
</head>
<body>
<div class="phone">
  <div class="topbar"><h1>ประวัติทริป</h1></div>
  <div class="scroll" id="scroll"><div class="empty">กำลังโหลด...</div></div>
  <div class="tabbar" id="tabbar"></div>
</div>

<script>
async function load() {
  const ME = await requireAuth();
  if (!ME) return;
  renderTabBar('history');

  const { data: memberRows, error } = await sb
    .from('trip_members')
    .select('trip_id, trips!inner(id,name,start_date,end_date,currency,status)')
    .eq('user_id', ME.id)
    .eq('trips.status', 'closed');

  const list = document.getElementById('scroll');
  if (error) { list.innerHTML = '<div class="empty">โหลดไม่สำเร็จ: ' + error.message + '</div>'; return; }
  const trips = (memberRows || []).map(r => r.trips).filter(Boolean);

  if (!trips.length) { list.innerHTML = '<div class="empty">ยังไม่มีทริปที่ปิดแล้ว</div>'; return; }

  const ids = trips.map(t => t.id);
  const { data: expenses } = await sb.from('ts_expenses').select('trip_id, amount').in('trip_id', ids);
  const totals = {};
  (expenses || []).forEach(e => totals[e.trip_id] = (totals[e.trip_id] || 0) + Number(e.amount));

  list.innerHTML = trips.map(t => `
    <div class="card" data-id="${t.id}">
      <div style="display:flex;align-items:center;gap:10px;">
        <div style="flex:1;min-width:0;">
          <div style="font-size:15.5px;font-weight:600;color:var(--ink);">${escapeHtml(t.name)}</div>
          <div style="margin-top:3px;font-size:12px;color:var(--faint);">${fmtDateRange(t.start_date, t.end_date)}</div>
        </div>
        <div style="text-align:right;">
          <div style="font-size:14.5px;font-weight:600;color:var(--ink);">${money(totals[t.id] || 0, t.currency)}</div>
          <span class="pill pill-closed">ปิดแล้ว</span>
        </div>
      </div>
    </div>`).join('');

  list.querySelectorAll('.card').forEach(el => el.addEventListener('click', () => location.href = 'trip.html?id=' + el.dataset.id + '&tab=summary'));
}

function escapeHtml(s) { return String(s || '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

load();
</script>
</body>
</html>
